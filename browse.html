<!DOCTYPE html>
<html lang="zh" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光日记 · 浏览</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif; margin:0; background:#fdf4ec; color:#1f2933; line-height:1.7; }
    header { background:linear-gradient(135deg,#ff9800,#f97316); color:#fff; padding:16px 16px; position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; }
    header .l { display:flex; align-items:center; gap:8px; }
    header .title { font-size:20px; font-weight:700; }
    header .back { color:#fff; text-decoration:none; font-size:22px; line-height:1; }
    header .right { display:flex; gap:10px; align-items:center; }
    header .iconbtn { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
    header .filter { background:rgba(255,255,255,.9); color:#e65100; border:none; padding:6px 12px; border-radius:16px; font-size:14px; font-weight:700; cursor:pointer; }
    .wrap { max-width:760px; margin:0 auto; padding:14px; }
    .card { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .card h3 { margin:0 0 4px; font-size:17px; }
    .card .meta { font-size:13px; color:#9a9a9a; }
    .card .prev { font-size:13px; color:#666; margin-top:2px; }
    .card .fav { font-size:20px; }
    .blocks img { max-width:100%; border-radius:10px; margin:8px 0; }
    .blocks video { max-width:100%; border-radius:10px; margin:8px 0; }
    .blocks audio { width:100%; margin:6px 0; }
    .blocks p { margin:8px 0; }
    .blocks .langtag { font-size:12px; background:#fff3e0; color:#e65100; padding:2px 8px; border-radius:6px; margin-left:6px; }
    .hd { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .hd h2 { margin:0; font-size:22px; flex:1; }
    .hd .favbtn { background:none; border:none; font-size:26px; cursor:pointer; }
    .cmt { border-top:1px solid #f0e0d0; padding:10px 0; }
    .cmt .author { color:#e65100; font-size:12px; font-weight:700; margin-right:4px; }
    .cmt .me { color:#e65100; font-size:12px; margin-right:4px; }
    .cmt audio { width:100%; margin-top:4px; }
    .cmtnone { color:#999; font-size:14px; padding:6px 0; }
    .inputbar { display:flex; gap:8px; align-items:center; border-top:1px solid #f0e0d0; padding-top:12px; margin-top:8px; }
    .inputbar input { flex:1; padding:11px; border:1px solid #e8d5c2; border-radius:22px; font-size:15px; }
    .inputbar .mic { width:44px; height:44px; border-radius:50%; border:none; background:#f97316; color:#fff; font-size:20px; cursor:pointer; flex:none; }
    .inputbar .send { padding:0 18px; height:44px; border:none; border-radius:22px; background:#f97316; color:#fff; font-size:15px; cursor:pointer; flex:none; }
    .msgbox { margin-top:16px; background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .msgbox strong { font-size:16px; }
    .msgbox .inputbar { border:none; padding-top:8px; }
    .ok-note { text-align:center; color:#e65100; font-size:14px; padding:6px; }
    .rec { color:#d32f2f; font-weight:700; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .3s; z-index:99; }
    .empty { color:#999; text-align:center; padding:24px 0; }
    html[data-lang="en"] .zh { display:none !important; }
    html[data-lang="zh"] .en { display:none !important; }
  </style>
</head>
<body>
  <header>
    <div class="l">
      <span id="backWrap" style="display:none"><a class="back" id="backBtn" href="./browse.html">‹</a></span>
      <span class="title" id="headerTitle" style="cursor:pointer" onclick="location.href='./index.html'">拾光日记</span>
    </div>
    <div class="right">
      <button class="iconbtn" id="langbtn" title="EN/中文" onclick="toggleLang()">🌐</button>
      <button class="iconbtn" title="主页" onclick="location.href='./index.html'">🏠</button>
      <button class="filter" id="filterBtn">只看收藏</button>
      <button class="iconbtn" title="发消息给作者" onclick="goMessage()">✉️</button>
    </div>
  </header>

  <div class="wrap">
    <div id="list"><div class="empty">加载中...</div></div>
    <div id="detail" style="display:none"></div>
    <div class="msgbox" id="msgbox">
      <strong id="msglabel">📨 给作者留言</strong>
      <div class="inputbar">
        <input id="msgText" placeholder="想对作者说点什么...">
        <button class="send" id="msgsend" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://elrsrrvvuhfbkmxnvtod.supabase.co";
    const SUPABASE_ANON = "sb_publishable_XuZtEeFeJK6GtQC1RE3O6A_ZoVMcaO6";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    let ONLY_FAV = false;
    let FAVS = new Set();
    let RECORDER = null, RECORDING = false, REC_BITS = [];
    const DEV = deviceId();
    let LANG = localStorage.getItem('lang') || 'zh';
    function t(zh,en){ return LANG==='en'?en:zh; }
    function applyLang(){
      document.documentElement.setAttribute('data-lang',LANG);
      document.getElementById('headerTitle').textContent = t('拾光日记','Sunlight Diary');
      var ml=document.getElementById('msglabel'); if(ml) ml.textContent = t('📨 给作者留言','📨 Message the author');
      var mi=document.getElementById('msgText'); if(mi) mi.placeholder = t('想对作者说点什么...','What would you like to tell the author...');
      var ms=document.getElementById('msgsend'); if(ms) ms.textContent = t('发送','Send');
      var ci=document.getElementById('cmtText'); if(ci) ci.placeholder = t('写评论...','Write a comment...');
      setFilter();
    }
    function toggleLang(){ LANG = LANG==='zh'?'en':'zh'; localStorage.setItem('lang',LANG); applyLang(); loadDiaries(); }

    function deviceId(){ let id=localStorage.getItem('diary_dev_id'); if(!id){ id='web-'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('diary_dev_id',id); } return id; }
    function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.style.opacity=1; setTimeout(()=>e.style.opacity=0,1800); }
    function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function langText(l){ return {sh:'上海话',nb:'宁波话',en:'英语',zh:'中文'}[l]||''; }

    async function loadFavs(){ try{ const {data}=await sb.from('favorites').select('diary_id').eq('device_id',DEV); FAVS=new Set((data||[]).map(x=>x.diary_id)); }catch(e){} }

    async function loadDiaries(){
      const el=document.getElementById('list'); el.innerHTML='<div class="empty">加载中...</div>';
      try{
        const {data}=await sb.from('diaries').select('id,title,blocks,created_at').order('created_at',{ascending:false});
        if(!data||!data.length){ el.innerHTML='<div class="empty">'+t('还没有日记，等作者发布吧','No diaries yet.')+'</div>'; return; }
        el.innerHTML='';
        data.forEach(d=>{
          if(ONLY_FAV && !FAVS.has(d.id)) return;
          const first=(d.blocks||[]).find(b=>b.type==='text');
          const prev=first?first.data.slice(0,50):'';
          const dt=(d.created_at||'').slice(0,16).replace('T',' ');
          const c=document.createElement('div'); c.className='card';
          c.innerHTML='<div><h3>'+esc(d.title)+'</h3><div class="prev">'+esc(prev)+'</div><div class="meta">'+dt+'</div></div><span class="fav">'+(FAVS.has(d.id)?'❤️':'🤍')+'</span>';
          c.onclick=()=>openDiary(d.id); el.appendChild(c);
        });
        if(!el.children.length) el.innerHTML='<div class="empty">'+(ONLY_FAV?t('还没有收藏的日记','No favorited diaries yet'):t('还没有日记','No diaries yet'))+'</div>';
      }catch(e){ el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
    }

    function setFilter(){ const b=document.getElementById('filterBtn'); b.textContent = ONLY_FAV ? t('全部','All') : t('只看收藏','Favorites only'); b.style.background = ONLY_FAV ? '#e65100' : 'rgba(255,255,255,.9)'; b.style.color = ONLY_FAV ? '#fff' : '#e65100'; }

    async function openDiary(id){
      document.getElementById('list').style.display='none';
      document.getElementById('detail').style.display='block';
      document.getElementById('backWrap').style.display='inline-block';
      const d=document.getElementById('detail'); d.innerHTML='<div class="empty">加载中...</div>';
      try{
        const {data,error}=await sb.from('diaries').select('id,title,blocks,created_at').eq('id',id).single();
        if(error) throw error;
        let fav=FAVS.has(id);
        let h='<div class="hd"><h2>'+esc(data.title)+'</h2><button class="favbtn" id="favbtn" onclick="toggleFav('+id+')">'+(fav?'❤️':'🤍')+'</button></div>';
        h+='<div class="meta" style="font-size:13px;color:#9a9a9a;margin-bottom:6px">'+(data.created_at||'').slice(0,16).replace('T',' ')+'</div>';
        h+='<div class="blocks">';
        (data.blocks||[]).forEach(b=>{
          if(b.type==='text') h+='<p>'+esc(b.data)+'</p>';
          else if(b.type==='image') h+='<img src="'+esc(b.data)+'" alt="图片">';
          else if(b.type==='video') h+='<video controls src="'+esc(b.data)+'"></video>';
          else if(b.type==='voice'){ const lt=langText(b.lang); h+='<audio controls src="'+esc(b.data)+'"></audio>'+(lt?'<span class="langtag">'+lt+'</span>':''); }
        });
        h+='</div><div id="cmts"></div>';
        h+='<div class="inputbar"><input id="cmtText" placeholder="'+t('写评论...','Write a comment...')+'"><button class="mic" id="micbtn" onclick="toggleRecord('+id+')'>🎤</button><button class="send" onclick="postComment('+id+')">'+t('发送','Send')+'</button></div>';
        d.innerHTML=h; loadComments(id);
      }catch(e){ d.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
    }

    async function loadComments(id){
      const box=document.getElementById('cmts');
      try{
        const {data}=await sb.from('comments').select('id,type,text,audio,device_id,is_admin,created_at').eq('diary_id',id).order('created_at',{ascending:true});
        if(!data||!data.length){ box.innerHTML='<div class="cmtnone">'+t('还没有评论','No comments yet')+'</div>'; return; }
        box.innerHTML=data.map(c=>{
          const me=c.device_id===DEV, admin=c.is_admin;
          const tag=admin?'<span class="author">作者</span>':(me?'<span class="me">我</span>':'');
          const del=(me||admin)?' <button class="del" style="border:none;background:none;color:#999;font-size:12px;cursor:pointer" onclick="delComment('+id+','+c.id+')">删除</button>':'';
          let body='';
          if(c.type==='voice'&&c.audio) body='<audio controls src="'+esc(c.audio)+'"></audio>';
          else body=esc(c.text||'');
          return '<div class="cmt">'+tag+body+'<div style="font-size:12px;color:#bbb">'+(c.created_at||'').slice(0,16).replace('T',' ')+'</div>'+del+'</div>';
        }).join('');
      }catch(e){ box.innerHTML=''; }
    }

    async function postComment(id){
      const t=document.getElementById('cmtText').value.trim();
      if(!t) return;
      try{ await sb.from('comments').insert({diary_id:id,type:'text',text:t,device_id:DEV,is_admin:false}); document.getElementById('cmtText').value=''; toast('已发表评论'); loadComments(id); }catch(e){ toast('评论失败：'+e.message); }
    }

    async function delComment(diaryId,cid){
      try{ await sb.from('comments').delete().eq('id',cid).eq('device_id',DEV); loadComments(diaryId); toast('已删除'); }catch(e){ toast('删除失败：'+e.message); }
    }

    async function toggleFav(id){
      try{
        if(FAVS.has(id)){ await sb.from('favorites').delete().eq('device_id',DEV).eq('diary_id',id); FAVS.delete(id); }
        else { await sb.from('favorites').insert({device_id:DEV,diary_id:id}); FAVS.add(id); }
        const b=document.getElementById('favbtn'); if(b) b.textContent=FAVS.has(id)?'❤️':'🤍';
        toast(FAVS.has(id)?'已收藏':'已取消收藏');
      }catch(e){ toast('收藏失败：'+e.message); }
    }

    // 语音评论：录音->上传->存 voice 评论
    async function toggleRecord(id){
      const btn=document.getElementById('micbtn');
      if(!RECORDING){
        try{
          const stream=await navigator.mediaDevices.getUserMedia({audio:true});
          const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m));
          RECORDER=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
          REC_BITS=[];
          RECORDER.ondataavailable=e=>{ if(e.data&&e.data.size) REC_BITS.push(e.data); };
          RECORDER.onstop=async()=>{
            stream.getTracks().forEach(t=>t.stop());
            if(!REC_BITS.length){ toast('录音太短'); return; }
            toast('上传语音中...');
            const blob=new Blob(REC_BITS,{type:RECORDER.mimeType||'audio/webm'});
            const ext=(RECORDER.mimeType||'').includes('ogg')?'ogg':'webm';
            const path='audio/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
            try{
              await sb.storage.from('media').upload(path, blob, {contentType:blob.type, upsert:false});
              const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
              await sb.from('comments').insert({diary_id:id,type:'voice',audio:url,device_id:DEV,is_admin:false});
              toast('语音评论已发表'); loadComments(id);
            }catch(e){ toast('语音上传失败：'+e.message); }
          };
          RECORDER.start();
          RECORDING=true; btn.textContent='🔴'; toast('开始录音...');
        }catch(e){ toast('无法录音：请授权麦克风'); }
      }else{
        RECORDER.stop(); RECORDING=false; btn.textContent='🎤';
      }
    }

    function goMessage(){
      var box=document.getElementById('msgbox'); if(box) box.scrollIntoView({behavior:'smooth'});
      var inp=document.getElementById('msgText'); if(inp) setTimeout(function(){ inp.focus(); },300);
    }

    async function sendMessage(){
      const t=document.getElementById('msgText').value.trim(); if(!t) return;
      try{ await sb.from('messages').insert({device_id:DEV,text:t}); document.getElementById('msgText').value=''; toast('已发送给作者'); }catch(e){ toast('发送失败：'+e.message); }
    }

    async function showList(){
      document.getElementById('detail').style.display='none';
      document.getElementById('backWrap').style.display='none';
      document.getElementById('list').style.display='block';
      document.getElementById('headerTitle').textContent=t('拾光日记','Sunlight Diary');
      loadDiaries();
    }

    document.getElementById('filterBtn').addEventListener('click',function(){ ONLY_FAV=!ONLY_FAV; setFilter(); loadDiaries(); });

    document.addEventListener('DOMContentLoaded', async ()=>{
      applyLang();
      await loadFavs();
      const id=new URLSearchParams(location.search).get('d');
      if(id) openDiary(parseInt(id)); else loadDiaries();
      document.getElementById('backBtn').addEventListener('click',function(e){ e.preventDefault(); showList(); });
    });
  </script>
</body>
</html>
